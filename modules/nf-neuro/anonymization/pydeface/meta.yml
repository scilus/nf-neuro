name: "pydeface"
description: Remove facial structures from MRI NIfTI images using PyDeface.
keywords:
  - neuroimaging
  - MRI
  - NIfTI
  - anonymization
  - defacing
tools:
  - pydeface:
    description: "A tool to remove facial structure from MRI images."
    homepage: "https://www.poldracklab.org"
    identifier: ""
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
        e.g. [id:'test']
  - nifti:
      type: file
      description: |
        Input anatomical MRI image in NIfTI format.
      pattern: "*.{nii,nii.gz}"
      ontologies:
        - edam: http://edamontology.org/format_3750
output:
  defaced:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information.
            e.g. [id:'test']
      - "*_defaced.nii.gz":
          type: file
          description: Defaced anatomical MRI image in NIfTI format.
          pattern: "*_defaced.nii.gz"
          ontologies:
            - edam: http://edamontology.org/format_3750
versions:
  - versions.yml:
      type: file
      description: File containing software versions
      pattern: versions.yml
      ontologies:
        - edam: http://edamontology.org/format_3750
authors:
  - "@loboehme1"

